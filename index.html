<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nine-67 · Resource & Project Planner</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1b2330; --muted:#6b7688; --line:#e4e8ef;
    --brand:#2f6df6; --brand-dark:#1f4fc4; --teal:#16a0a0;
    --ok:#1f9d57; --okbg:#e7f6ee; --warn:#e8a13a; --warnbg:#fdf3e2;
    --bad:#e0533d; --badbg:#fde9e5; --idle:#8a93a3; --idlebg:#eef1f5;
    --shadow:0 1px 3px rgba(20,30,55,.08),0 6px 24px rgba(20,30,55,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  h1,h2,h3,h4{margin:0;font-weight:650}
  a{color:var(--brand)}
  button{font-family:inherit;cursor:pointer}
  .app{max-width:1280px;margin:0 auto;padding:0 20px 80px}

  /* Header */
  header.top{display:flex;align-items:center;gap:14px;padding:18px 0 14px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--teal));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px}
  .brandwrap h1{font-size:18px}
  .brandwrap .sub{color:var(--muted);font-size:12.5px}
  .top .spacer{flex:1}
  .top .date{color:var(--muted);font-size:12.5px;text-align:right}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600}
  .btn:hover{border-color:#cdd4df;background:#fafbfc}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark)}
  .btn.danger{color:var(--bad);border-color:#f1c9c1}
  .btn.danger:hover{background:var(--badbg)}
  .btn.tiny{padding:4px 9px;font-size:12px;border-radius:7px}

  /* Nav */
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
  nav.tabs button{background:none;border:none;padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}

  /* Cards / layout */
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow)}
  .stat .label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .big{font-size:28px;font-weight:750;margin-top:6px}
  .stat .note{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stat.alert .big{color:var(--bad)}
  .stat.good .big{color:var(--ok)}

  .section-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
  .section-title h2{font-size:16px}
  .section-title .spacer{flex:1}

  /* Tables */
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:13px;overflow:hidden;
    box-shadow:var(--shadow);border:1px solid var(--line)}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfd;font-weight:700}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafbfd}
  .name{font-weight:650}
  .sub2{color:var(--muted);font-size:12.5px}

  /* Pills / tags */
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap}
  .pill.ok{background:var(--okbg);color:#147a43}
  .pill.warn{background:var(--warnbg);color:#a76a13}
  .pill.bad{background:var(--badbg);color:#b53521}
  .pill.idle{background:var(--idlebg);color:#5d6675}
  .pill.pri-High{background:#fde9e5;color:#b53521}
  .pill.pri-Medium{background:#fdf3e2;color:#a76a13}
  .pill.pri-Low{background:#eef1f5;color:#5d6675}
  .tag{display:inline-block;background:#eef2fb;color:#39507f;border-radius:6px;padding:2px 7px;font-size:11.5px;margin:2px 3px 2px 0}

  /* Capacity bar */
  .bar{position:relative;height:9px;border-radius:6px;background:#eef1f5;overflow:hidden;min-width:90px}
  .bar > span{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .bar .fill-ok{background:var(--ok)} .bar .fill-warn{background:var(--warn)} .bar .fill-bad{background:var(--bad)}
  .barwrap{display:flex;align-items:center;gap:9px}
  .barwrap .num{font-variant-numeric:tabular-nums;font-weight:650;min-width:42px}

  /* Toolbar filters */
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=text],input[type=date],input[type=number],select,textarea{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,109,246,.12)}
  .toolbar .search{flex:1;min-width:180px}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
  label.fld input,label.fld select,label.fld textarea{font-weight:400;color:var(--ink)}

  /* Timeline */
  .tl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
  table.tl{box-shadow:none;border:none;border-radius:0;min-width:900px}
  table.tl th.week{text-align:center;font-size:10.5px;min-width:46px;padding:8px 2px;white-space:nowrap}
  table.tl th.week.mstart{border-left:2px solid var(--line)}
  table.tl td.cell{padding:3px;text-align:center}
  .tlcell{height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff}
  table.tl td.pname{font-weight:650;white-space:nowrap;position:sticky;left:0;background:var(--panel);z-index:1}
  table.tl thead th.pname{position:sticky;left:0;background:#fafbfd;z-index:2}

  /* Assistant */
  .assistant-grid{display:grid;grid-template-columns:1fr 300px;gap:16px}
  @media(max-width:880px){.assistant-grid{grid-template-columns:1fr}.assistant-grid{grid-template-columns:1fr}}
  .chat{display:flex;flex-direction:column;height:560px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
  .chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13.5px;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:#f1f4f9;color:var(--ink);border-bottom-left-radius:4px}
  .msg.bot.action{background:var(--okbg);border:1px solid #bfe6cf}
  .msg b{font-weight:700}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .chat-input input{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
  .chip{background:#eef2fb;color:#39507f;border:none;border-radius:16px;padding:5px 11px;font-size:12px;font-weight:600}
  .chip:hover{background:#dde6f8}
  .side-card h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .summ-btn{display:block;width:100%;text-align:left;margin-bottom:7px}
  .suggestion{font-size:12.5px;border-left:3px solid var(--brand);padding:6px 10px;background:#f7f9fe;border-radius:0 8px 8px 0;margin-bottom:8px}
  .suggestion b{color:var(--ink)}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,55,.45);display:flex;align-items:flex-start;
    justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
  .modal{background:#fff;border-radius:15px;width:100%;max-width:540px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{padding:18px 20px;border-bottom:1px solid var(--line);font-size:16px}
  .modal .body{padding:18px 20px;display:grid;gap:13px}
  .modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
  .hint{font-size:12px;color:var(--muted)}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .flex{display:flex;align-items:center;gap:8px}
  .wrap-actions{display:flex;gap:6px;flex-wrap:wrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .banner{background:var(--badbg);border:1px solid #f1c9c1;color:#9c2f1d;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .banner.info{background:#eef4ff;border-color:#cfe0ff;color:#2a4d96}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">967</div>
    <div class="brandwrap">
      <h1>Resource &amp; Project Planner</h1>
      <div class="sub">Plan who's working on what — and ask in plain English.</div>
    </div>
    <div class="spacer"></div>
    <div class="date" id="todayLabel"></div>
    <button class="btn" id="resetBtn" title="Restore the original sample data">Reset sample data</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="people">People</button>
    <button data-tab="projects">Projects</button>
    <button data-tab="allocations">Allocations</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="whatif">What-if</button>
    <button data-tab="assistant">AI Assistant</button>
  </nav>

  <div id="view"></div>
</div>

<div id="modalRoot"></div>

<script>
/* ============================================================
   Nine-67 Resource & Project Planner
   Single-file app. No build step, no dependencies, no API key.
   Data persists in your browser (localStorage).
   ============================================================ */

const TODAY = new Date('2026-06-03T00:00:00');
const STORE_KEY = 'nine67_planner_v1';

/* ---------- Date helpers ---------- */
const DAY = 86400000;
function d(s){ return new Date(s + 'T00:00:00'); }
function iso(dt){ return dt.toISOString().slice(0,10); }
function fmt(dt){ return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtShort(dt){ return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function mondayOf(dt){ const x=new Date(dt); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function addDays(dt,n){ const x=new Date(dt); x.setDate(x.getDate()+n); return x; }
function overlaps(aS,aE,bS,bE){ return aS<=bE && aE>=bS; }
function clampDay(dt){ const x=new Date(dt); x.setHours(0,0,0,0); return x; }

/* ---------- Sample data ---------- */
function sampleData(){
  return {
    people:[
      {id:'p1', name:'Priya Nair',     role:'Senior Engineer', team:'Engineering', skills:['Backend','Python','Lab Systems'], capacity:100, timeOff:[]},
      {id:'p2', name:'Marcus Chen',    role:'Engineer',        team:'Engineering', skills:['Frontend','React','JavaScript'], capacity:100, timeOff:[]},
      {id:'p3', name:'Sofia Alvarez',  role:'Data Scientist',  team:'Data',        skills:['Python','ML','Statistics'], capacity:100, timeOff:[{start:'2026-07-13',end:'2026-07-24',label:'Vacation'}]},
      {id:'p4', name:'James Okoro',    role:'DevOps Engineer', team:'Platform',    skills:['AWS','Kubernetes','CI/CD'], capacity:100, timeOff:[]},
      {id:'p5', name:'Hannah Schmidt', role:'UX Designer',     team:'Design',      skills:['UX','Figma','Research'], capacity:80, timeOff:[]},
      {id:'p6', name:'Liam Murphy',    role:'Project Manager', team:'PMO',         skills:['Planning','Stakeholder Mgmt'], capacity:100, timeOff:[]},
      {id:'p7', name:'Aisha Khan',     role:'QA Engineer',     team:'Engineering', skills:['Testing','Automation','Python'], capacity:100, timeOff:[]},
      {id:'p8', name:'Diego Santos',   role:'Engineer',        team:'Engineering', skills:['Backend','Java','Lab Systems'], capacity:100, timeOff:[{start:'2026-08-03',end:'2026-08-07',label:'Conference'}]},
      {id:'p9', name:'Emma Wilson',    role:'Data Engineer',   team:'Data',        skills:['SQL','ETL','Python'], capacity:60, timeOff:[]},
      {id:'p10',name:'Noah Brown',     role:'Engineer',        team:'Engineering', skills:['Frontend','React','Mobile'], capacity:100, timeOff:[]},
    ],
    projects:[
      {id:'pr1', name:'Atlas', description:'Customer portal redesign', start:'2026-05-01', end:'2026-09-30', priority:'High',
        needs:[{skill:'Frontend',count:2},{skill:'UX',count:1},{skill:'Backend',count:1}]},
      {id:'pr2', name:'Helix', description:'Lab data pipeline', start:'2026-06-01', end:'2026-11-30', priority:'High',
        needs:[{skill:'Lab Systems',count:2},{skill:'Python',count:1},{skill:'ETL',count:1}]},
      {id:'pr3', name:'Orion', description:'Internal analytics dashboard', start:'2026-07-01', end:'2026-10-15', priority:'Medium',
        needs:[{skill:'ML',count:1},{skill:'Frontend',count:1},{skill:'SQL',count:1}]},
      {id:'pr4', name:'Vega', description:'Platform migration to Kubernetes', start:'2026-04-01', end:'2026-08-31', priority:'Medium',
        needs:[{skill:'AWS',count:1},{skill:'Kubernetes',count:1},{skill:'CI/CD',count:1}]},
      {id:'pr5', name:'Nova', description:'Mobile app launch', start:'2026-08-01', end:'2026-12-15', priority:'Low',
        needs:[{skill:'Mobile',count:1},{skill:'React',count:1},{skill:'Testing',count:1}]},
    ],
    allocations:[
      {id:'a1', personId:'p1', projectId:'pr1', percent:50, start:'2026-05-01', end:'2026-09-30'},
      {id:'a2', personId:'p1', projectId:'pr2', percent:60, start:'2026-06-01', end:'2026-11-30'},
      {id:'a3', personId:'p2', projectId:'pr1', percent:70, start:'2026-05-01', end:'2026-09-30'},
      {id:'a4', personId:'p2', projectId:'pr3', percent:40, start:'2026-07-01', end:'2026-10-15'},
      {id:'a5', personId:'p3', projectId:'pr3', percent:50, start:'2026-07-01', end:'2026-10-15'},
      {id:'a6', personId:'p4', projectId:'pr4', percent:80, start:'2026-04-01', end:'2026-08-31'},
      {id:'a7', personId:'p5', projectId:'pr1', percent:60, start:'2026-05-01', end:'2026-09-30'},
      {id:'a8', personId:'p6', projectId:'pr1', percent:20, start:'2026-05-01', end:'2026-09-30'},
      {id:'a9', personId:'p6', projectId:'pr2', percent:20, start:'2026-06-01', end:'2026-11-30'},
      {id:'a10',personId:'p6', projectId:'pr3', percent:20, start:'2026-07-01', end:'2026-10-15'},
      {id:'a11',personId:'p8', projectId:'pr2', percent:80, start:'2026-06-01', end:'2026-11-30'},
      {id:'a12',personId:'p9', projectId:'pr2', percent:40, start:'2026-06-01', end:'2026-11-30'},
      {id:'a13',personId:'p7', projectId:'pr5', percent:50, start:'2026-08-01', end:'2026-12-15'},
    ],
  };
}

/* ---------- State / persistence ---------- */
let state = load();
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return sampleData();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function resetData(){ state = sampleData(); save(); render(); }
function uid(p){ return p + Math.random().toString(36).slice(2,8); }

/* ---------- Lookups ---------- */
const personById  = id => state.people.find(p=>p.id===id);
const projectById = id => state.projects.find(p=>p.id===id);
function personByName(txt){
  txt = txt.toLowerCase();
  // exact-ish: match if a person's first name or full name appears in text
  let best=null, bestLen=0;
  for(const p of state.people){
    const full=p.name.toLowerCase(), first=full.split(' ')[0];
    if(txt.includes(full) && full.length>bestLen){best=p;bestLen=full.length;}
    else if(txt.includes(first) && first.length>bestLen){best=p;bestLen=first.length;}
  }
  return best;
}
function projectByName(txt){
  txt = txt.toLowerCase();
  let best=null,bestLen=0;
  for(const pr of state.projects){
    const n=pr.name.toLowerCase();
    if(txt.includes(n) && n.length>bestLen){best=pr;bestLen=n.length;}
  }
  return best;
}
function allSkills(){
  const s=new Set();
  state.people.forEach(p=>p.skills.forEach(x=>s.add(x)));
  state.projects.forEach(p=>p.needs.forEach(n=>s.add(n.skill)));
  return [...s].sort();
}
function allTeams(){ return [...new Set(state.people.map(p=>p.team))].sort(); }

/* ---------- Core calculations ---------- */
// Does a person provide a given skill? Matches their listed skills, and also
// their role (so a need for "Engineer" is met by anyone whose role is Engineer).
function personHasSkill(person, skill){
  const s=skill.toLowerCase();
  if(person.skills.some(x=>x.toLowerCase()===s)) return true;
  return person.role.toLowerCase().includes(s);
}
// Is a person off on a given date?
function isOff(person, date){
  return (person.timeOff||[]).some(t=> date>=d(t.start) && date<=d(t.end));
}
// Effective capacity on a date (0 if on time off)
function capacityOn(person, date){ return isOff(person,date) ? 0 : person.capacity; }

// Allocations for a person, optionally only those active in a date window
function allocationsFor(personId, winS, winE){
  return (state.allocations||[]).filter(a=>{
    if(a.personId!==personId) return false;
    if(winS && winE){ return overlaps(d(a.start),d(a.end),winS,winE); }
    return true;
  });
}
// Workload (% of full time) at a single date
function workloadOn(person, date){
  let total=0;
  for(const a of state.allocations){
    if(a.personId!==person.id) continue;
    if(date>=d(a.start) && date<=d(a.end)) total+=a.percent;
  }
  return total;
}
// Average weekly workload across a window (uses week starts)
function avgWorkload(person, winS, winE){
  const weeks = weeksBetween(winS, winE);
  if(!weeks.length) return workloadOn(person, winS);
  let sum=0; weeks.forEach(w=> sum+=workloadOn(person, addDays(w,2)) ); // sample mid-week
  return Math.round(sum/weeks.length);
}
// Peak weekly workload across window
function peakWorkload(person, winS, winE){
  const weeks = weeksBetween(winS, winE);
  let peak=0; weeks.forEach(w=>{ peak=Math.max(peak, workloadOn(person, addDays(w,2))); });
  return peak;
}
function weeksBetween(winS, winE){
  const out=[]; let w=mondayOf(winS); const end=clampDay(winE);
  while(w<=end){ out.push(new Date(w)); w=addDays(w,7); if(out.length>120)break; }
  return out;
}
// Status as of today
function statusToday(person){
  const off = isOff(person, TODAY);
  const load = workloadOn(person, TODAY);
  const cap = person.capacity;
  if(off) return {kind:'off', load, cap, label:'On time off'};
  if(load > cap) return {kind:'bad', load, cap, label:'Over-allocated'};
  if(load === 0) return {kind:'idle', load, cap, label:'Idle'};
  if(load >= cap*0.85) return {kind:'warn', load, cap, label:'Near full'};
  return {kind:'ok', load, cap, label:'Available'};
}

// Project staffing: who's on it + skill gaps
function projectStaffing(project, winS, winE){
  const S=winS||d(project.start), E=winE||d(project.end);
  const members = state.allocations
    .filter(a=> a.projectId===project.id && overlaps(d(a.start),d(a.end),S,E))
    .map(a=>({alloc:a, person:personById(a.personId)})).filter(m=>m.person);
  // dedupe people (a person could have >1 alloc on same project)
  const peopleOn=[...new Set(members.map(m=>m.person.id))].map(personById);
  const gaps=[];
  for(const need of project.needs){
    const have = peopleOn.filter(p=>personHasSkill(p,need.skill)).length;
    if(have < need.count) gaps.push({skill:need.skill, need:need.count, have, missing:need.count-have});
  }
  return {members, peopleOn, gaps};
}

// Capacity vs demand totals (current week)
function portfolioTotals(){
  let capacity=0, demand=0;
  state.people.forEach(p=> capacity += capacityOn(p, TODAY));
  state.people.forEach(p=> demand += workloadOn(p, TODAY));
  const over = state.people.filter(p=> statusToday(p).kind==='bad');
  const idle = state.people.filter(p=> statusToday(p).kind==='idle');
  const understaffed = state.projects.filter(pr=>{
    if(d(pr.end)<TODAY || d(pr.start)>addDays(TODAY,120)) {/* still include active soon */}
    return projectStaffing(pr).gaps.length>0;
  });
  return {capacity, demand, over, idle, understaffed};
}

// Suggestions: for an over-allocated person or a project gap, who could help
function suggestForGap(skill, project, winS, winE){
  const S=winS||d(project.start), E=winE||d(project.end);
  const onProject = new Set(projectStaffing(project,S,E).peopleOn.map(p=>p.id));
  const candidates = state.people
    .filter(p=> personHasSkill(p,skill) && !onProject.has(p.id))
    .map(p=>{
      const avg=avgWorkload(p,S,E);
      return {person:p, avg, spare: p.capacity-avg};
    })
    .filter(c=> c.spare>0)
    .sort((a,b)=> b.spare-a.spare);
  return candidates;
}
function suggestRelief(person){
  // who could take over some of this person's work — same-skill people with spare capacity
  const winS=TODAY, winE=addDays(TODAY,90);
  const out=[];
  for(const a of allocationsFor(person.id, winS, winE)){
    const pr=projectById(a.projectId); if(!pr) continue;
    // find a skill this project needs that the person provides
    const relevantSkill=(pr.needs.find(n=>person.skills.includes(n.skill))||{}).skill || person.skills[0];
    const cands=suggestForGap(relevantSkill, pr, winS, winE).slice(0,2);
    if(cands.length) out.push({project:pr, alloc:a, skill:relevantSkill, candidates:cands});
  }
  return out;
}

/* ---------- Utilization color ---------- */
function utilClass(load, cap){
  if(cap<=0) return 'idle';
  const r=load/cap;
  if(r>1.0) return 'bad';
  if(r>=0.85) return 'warn';
  if(r<=0.001) return 'idle';
  return 'ok';
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function barHtml(load, cap){
  const cls=utilClass(load,cap);
  const pct=Math.min(100, cap>0? Math.round(load/cap*100): (load>0?100:0));
  return `<div class="barwrap"><div class="bar"><span class="fill-${cls==='idle'?'ok':cls}" style="width:${pct}%"></span></div>
    <span class="num">${load}%</span></div>`;
}

/* ---------- Timeline ---------- */
function renderTimeline(){
  const start=mondayOf(TODAY); const N=16;
  const weeks=[]; for(let i=0;i<N;i++) weeks.push(addDays(start,i*7));
  let html=`<div class="section-title"><h2>Allocation timeline · next ${N} weeks</h2></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--ok)"></i>Healthy (≤85%)</span>
      <span><i class="sw" style="background:var(--warn)"></i>Near full</span>
      <span><i class="sw" style="background:var(--bad)"></i>Over-allocated</span>
      <span><i class="sw" style="background:var(--idle)"></i>Time off</span>
      <span><i class="sw" style="background:#eef1f5"></i>Idle / free</span>
    </div>
    <div class="tl-wrap"><table class="tl"><thead><tr><th class="pname">Person</th>`;
  let curMonth=-1;
  for(const w of weeks){
    const m=w.getMonth(); const mstart=(m!==curMonth); curMonth=m;
    const lbl=(w.getDate()<=7? w.toLocaleDateString('en-US',{month:'short'})+' ' : '')+w.getDate();
    html+=`<th class="week ${mstart?'mstart':''}">${lbl}</th>`;
  }
  html+=`</tr></thead><tbody>`;
  for(const p of state.people){
    html+=`<tr><td class="pname">${esc(p.name)}<div class="sub2">${esc(p.team)}</div></td>`;
    for(const w of weeks){
      const mid=addDays(w,2);
      const off=isOff(p,mid);
      const load=workloadOn(p,mid);
      const cap=p.capacity;
      if(off){ html+=`<td class="cell"><div class="tlcell" style="background:var(--idle)" title="Time off">off</div></td>`; }
      else if(load===0){ html+=`<td class="cell"><div class="tlcell" style="background:#eef1f5;color:#9aa3b2" title="No work assigned">—</div></td>`; }
      else{
        const cls=utilClass(load,cap);
        const color=cls==='bad'?'var(--bad)':cls==='warn'?'var(--warn)':'var(--ok)';
        html+=`<td class="cell"><div class="tlcell" style="background:${color}" title="${load}% of ${cap}%">${load}</div></td>`;
      }
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table></div>
    <p class="hint" style="margin-top:10px">Each cell is one week, showing total workload as % of full time. Red means over 100% (over-allocated).</p>`;
  view.innerHTML=html;
}

function renderWhatIf(){

function runWhatIf(){
  // snapshot
  const snapshot=JSON.parse(JSON.stringify(state));
  const before={}; state.people.forEach(p=> before[p.id]=workloadOn(p,TODAY));
  let note='';
  if(whatIf.action==='add-alloc'){
    const pid=document.getElementById('wfPerson').value, prid=document.getElementById('wfProject').value;
    const pct=+document.getElementById('wfPct').value||0; whatIf.percent=pct;
    const pr=projectById(prid);
    state.allocations.push({id:'tmp', personId:pid, projectId:prid, percent:pct, start:pr.start, end:pr.end});
    note=`Assigning ${esc(personById(pid).name)} to ${esc(pr.name)} at ${pct}%.`;
  } else if(whatIf.action==='remove-person'){
    const pid=document.getElementById('wfRemove').value;
    note=`Removing ${esc(personById(pid).name)} — their ${allocationsFor(pid).length} assignment(s) would be unstaffed.`;
    state.people=state.people.filter(p=>p.id!==pid);
    state.allocations=state.allocations.filter(a=>a.personId!==pid);
  } else {
    const name=document.getElementById('wfName').value||'New Project';
    const startD=document.getElementById('wfStart').value;
    const eng=+document.getElementById('wfEng').value||1;
    whatIf.npName=name; whatIf.npStart=startD; whatIf.npEngineers=eng;
    const endD=iso(addDays(d(startD),120));
    const prid=uid('pr');
    state.projects.push({id:prid,name,description:'(what-if)',start:startD,end:endD,priority:'Medium',
      needs:[{skill:'Engineer',count:eng}]});
    // pull in engineers with most spare capacity
    const eng_people=state.people.filter(p=>p.role.toLowerCase().includes('engineer'))
      .map(p=>({p,spare:p.capacity-workloadOn(p,d(startD))})).sort((a,b)=>b.spare-a.spare).slice(0,eng);
    eng_people.forEach(e=> state.allocations.push({id:'tmp',personId:e.p.id,projectId:prid,percent:50,start:startD,end:endD}));
    note=`Adding <b>${esc(name)}</b> starting ${fmt(d(startD))}, tentatively staffed with ${eng_people.map(e=>esc(e.p.name.split(' ')[0])).join(', ')||'no available engineers'} at 50% each.`;
  }
  // compute after using the projected start date when relevant
  const probe = whatIf.action==='add-project' ? addDays(d(whatIf.npStart),7) : TODAY;
  const after={}; state.people.forEach(p=> after[p.id]=workloadOn(p,probe));

  // build result table
  let rows='';
  const ids=new Set([...Object.keys(before),...Object.keys(after)]);
  const affected=[...ids].map(id=>({id, name:(snapshot.people.find(p=>p.id===id)||{}).name||'(removed)',
      b:before[id], a:after[id], cap:(snapshot.people.find(p=>p.id===id)||{}).capacity||100}))
    .filter(r=> r.a!==undefined && r.b!==r.a)
    .sort((x,y)=> (y.a/y.cap)-(x.a/x.cap));
  if(!affected.length){ rows=`<tr><td colspan="4"><div class="empty">No change to anyone's current workload.</div></td></tr>`; }
  for(const r of affected){
    const wasOver=r.b>r.cap, nowOver=r.a>r.cap;
    const flag = nowOver? `<span class="pill bad">Over-allocated</span>` : wasOver&&!nowOver? `<span class="pill ok">Now OK</span>` : '';
    rows+=`<tr><td class="name">${esc(r.name)}</td><td>${r.b}%</td>
      <td>${barHtml(r.a,r.cap)}</td><td>${flag}</td></tr>`;
  }
  const newOver=affected.filter(r=>r.a>r.cap).length;
  // restore
  state=snapshot;
  document.getElementById('wfResult').innerHTML=`
    <div class="banner info">${note}</div>
    ${newOver?`<div class="banner">This scenario would leave <b>${newOver}</b> ${newOver===1?'person':'people'} over-allocated.</div>`:''}
    <div class="section-title"><h2>Projected impact</h2></div>
    <table><thead><tr><th>Person</th><th>Workload before</th><th>Workload after</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="margin-top:14px"><button class="btn primary" onclick="applyWhatIf()">Apply this change for real</button></div>`;
}
function applyWhatIf(){
  // Use the choices captured during runWhatIf (lastWf) to apply permanently.
  const w=lastWf;
  if(!w){ alert('Please preview first.'); return; }
  if(w.kind==='add-alloc'){
    const pr=projectById(w.prid);
    state.allocations.push({id:uid('a'),personId:w.pid,projectId:w.prid,percent:w.pct,start:pr.start,end:pr.end});
  } else if(w.kind==='remove-person'){
    state.people=state.people.filter(p=>p.id!==w.pid);
    state.allocations=state.allocations.filter(a=>a.personId!==w.pid);
  } else if(w.kind==='add-project'){
    const prid=uid('pr'); const endD=iso(addDays(d(w.start),120));
    state.projects.push({id:prid,name:w.name,description:'Added via what-if',start:w.start,end:endD,priority:'Medium',

  }
  save();
  currentTab='dashboard'; render();
}

/* ----- Plain-English range parsing ----- */
function parseRange(text){
  text=text.toLowerCase();
  const y=TODAY.getFullYear();
  const qm={ 'q1':[0,2],'q2':[3,5],'q3':[6,8],'q4':[9,11] };
  for(const k in qm){ if(text.includes(k)){ const [a,b]=qm[k]; return {s:new Date(y,a,1), e:new Date(y,b+1,0), label:k.toUpperCase()}; } }
  if(text.includes('this quarter')){ const q=Math.floor(TODAY.getMonth()/3); return {s:new Date(y,q*3,1), e:new Date(y,q*3+3,0), label:'this quarter'}; }
  if(text.includes('next quarter')){ const q=Math.floor(TODAY.getMonth()/3)+1; return {s:new Date(y,q*3,1), e:new Date(y,q*3+3,0), label:'next quarter'}; }
  if(text.includes('next month')){ const m=TODAY.getMonth()+1; return {s:new Date(y,m,1), e:new Date(y,m+1,0), label:'next month'}; }
  if(text.includes('this month')){ const m=TODAY.getMonth(); return {s:new Date(y,m,1), e:new Date(y,m+1,0), label:'this month'}; }
  const months=['january','february','march','april','may','june','july','august','september','october','november','december'];
  for(let i=0;i<12;i++){ if(text.includes(months[i])){ return {s:new Date(y,i,1), e:new Date(y,i+1,0), label:months[i][0].toUpperCase()+months[i].slice(1)}; } }
  if(text.includes('next week')){ const s=addDays(mondayOf(TODAY),7); return {s, e:addDays(s,6), label:'next week'}; }
  if(text.includes('this week')||text.includes(' now')||text.includes('right now')||text.includes('today')){ const s=mondayOf(TODAY); return {s, e:addDays(s,6), label:'this week'}; }
  return null;
}
function findSkillIn(text){
  text=text.toLowerCase();
  let best=null,len=0;
  for(const s of allSkills()){ if(text.includes(s.toLowerCase()) && s.length>len){best=s;len=s.length;} }
  // common phrasings
  if(!best){ if(text.includes('lab')) best='Lab Systems'; else if(text.includes('front')) best='Frontend'; else if(text.includes('back')) best='Backend'; }
  return best;
}

/* ----- The answer engine ----- */
function answer(qRaw){
  const q=qRaw.toLowerCase().trim();

  // ---------- COMMANDS (mutations) ----------
  // move X off PROJECT by N%   /  reduce X on PROJECT by N%
  let m=q.match(/(?:move|take|reduce|cut)\s+(.+?)\s+(?:off|from|on|down)\s+(?:project\s+)?(.+?)\s+by\s+(\d+)\s*%?/);
  if(m){ return cmdAdjust(m[1],m[2],-Math.abs(+m[3])); }
  // move X off PROJECT  (full removal)
  m=q.match(/(?:move|take|remove|pull)\s+(.+?)\s+(?:off|from)\s+(?:project\s+)?(.+)/);
  if(m && !q.includes('add')){ const pr=projectByName(m[2]); const p=personByName(m[1]);
    if(p&&pr) return cmdAdjust(m[1],m[2],-100); }
  // increase X on PROJECT by N%
  m=q.match(/(?:add|increase|bump|raise)\s+(.+?)\s+(?:on|to)\s+(?:project\s+)?(.+?)\s+by\s+(\d+)\s*%?/);
  if(m){ const p=personByName(m[1]); if(p) return cmdAdjust(m[1],m[2],Math.abs(+m[3])); }
  // assign X to PROJECT (by N%)
  m=q.match(/(?:assign|put|add)\s+(.+?)\s+(?:to|on|onto)\s+(?:project\s+)?(.+?)(?:\s+(?:by|at)\s+(\d+)\s*%?)?$/);
  if(m && personByName(m[1]) && projectByName(m[2]) && !q.includes('new project')){
    return cmdAssign(m[1],m[2], m[3]?+m[3]:50);
  }
  // add a new project called X ... needs N engineers ... starting in MONTH
  if(/(add|create).*(new )?project/.test(q) || /new project called/.test(q)){
    return cmdAddProject(qRaw);
  }
  // remove person X
  m=q.match(/(?:remove|delete|drop)\s+(?:person\s+)?(.+)/);
  if(m && personByName(m[1]) && !projectByName(m[1])){ return cmdRemovePerson(m[1]); }

  // ---------- QUESTIONS ----------
  const range=parseRange(q);

  // over-allocated
  if(/over[\s-]?alloc|over[\s-]?committ|overloaded|too much|stretched/.test(q)){
    return qOverAllocated(range);
  }
  // idle / free / available / capacity
  if(/\b(idle|sitting idle|free|available|spare|capacity|bandwidth|under[\s-]?util)\b/.test(q) && !/skill/.test(q)){
    // "who can take on" handled below if a skill is named
    const skill=findSkillIn(q);
    if(skill && /(take on|take|capacity|skills?)/.test(q)) return qWhoCanTake(skill,range);
    return qFree(range);
  }
  // who can take on a <skill> project / who has skills and capacity
  if(/(take on|who has|who could|skills? and (the )?capacity|staff)/.test(q)){
    const skill=findSkillIn(q);
    if(skill) return qWhoCanTake(skill,range);
  }
  // at risk
  if(/at risk|risk|in trouble|behind|problem/.test(q)){
    return qAtRisk(range);
  }
  // workload of a person
  const person=personByName(q);
  if(person && /(workload|how busy|allocat|working on|load|booked|schedule)/.test(q)){
    return {text:personSummaryText(person)};
  }
  // staffing of a project
  const proj=projectByName(q);
  if(proj && /(staff|who.?s on|team|gap|covered)/.test(q)){
    return {text:projectSummaryText(proj)};
  }
  // skill listing: who knows X
  const skill=findSkillIn(q);
  if(skill && /(who knows|who has|who can do|skill)/.test(q)){
    const have=state.people.filter(p=>personHasSkill(p,skill));
    return {text:`People with <b>${esc(skill)}</b>: `+ (have.length? have.map(p=>`${esc(p.name)} (${workloadOn(p,TODAY)}% used)`).join(', '):'none recorded')+'.'};
  }
  // fallback person/project quick info
  if(person) return {text:personSummaryText(person)};
  if(proj) return {text:projectSummaryText(proj)};

  // help
  return {html:`I can answer questions about workload, availability, skills and risk, and I can make changes for you. Try:<br>
    • <i>Who's free next month?</i><br>• <i>Is anyone over-allocated in Q3?</i><br>• <i>Who can take on a lab-systems project?</i><br>
    • <i>What's at risk this quarter?</i><br>• <i>Move Priya off Atlas by 20%</i><br>• <i>Assign Noah to Nova by 50%</i><br>
    • <i>Add a new project called Helix starting in August that needs two engineers</i>`};
}

/* ----- Question handlers ----- */
function qFree(range){
  const S=range?range.s:TODAY, E=range?range.e:TODAY;
  const lbl=range?range.label:'right now';
  const rows=state.people.map(p=>{
    const load=range? avgWorkload(p,S,E) : workloadOn(p,TODAY);
    return {p,load,spare:p.capacity-load};
  }).filter(r=>r.spare>0).sort((a,b)=>b.spare-a.spare);
  if(!rows.length) return {text:`Everyone is fully committed ${lbl}. No spare capacity.`};
  const list=rows.map(r=>`<b>${esc(r.p.name)}</b> — ${r.spare}% free (${esc(r.p.skills.slice(0,3).join(', '))})`).join('<br>');
  return {html:`People with spare capacity ${esc(lbl)}:<br>${list}`};
}
function qWhoCanTake(skill,range){
  const S=range?range.s:TODAY, E=range?range.e:addDays(TODAY,90);
  const lbl=range?range.label:'over the next 3 months';
  const rows=state.people.filter(p=>personHasSkill(p,skill)).map(p=>{
    const load=avgWorkload(p,S,E); return {p,load,spare:p.capacity-load};
  }).sort((a,b)=>b.spare-a.spare);
  if(!rows.length) return {text:`No one currently lists the skill “${esc(skill)}”. You may need to hire or upskill.`};
  const free=rows.filter(r=>r.spare>0);
  if(!free.length) return {html:`People with <b>${esc(skill)}</b> skills: ${rows.map(r=>esc(r.p.name)).join(', ')} — but all are fully booked ${esc(lbl)}. Consider reprioritising.`};
  const list=free.map(r=>`<b>${esc(r.p.name)}</b> — ${r.spare}% free, ${esc(r.p.role)}`).join('<br>');
  return {html:`Best fits for a <b>${esc(skill)}</b> project (${esc(lbl)}):<br>${list}`};
}
function qOverAllocated(range){
  if(!range){
    const over=state.people.filter(p=>statusToday(p).kind==='bad');
    if(!over.length) return {text:'Good news — no one is over-allocated this week.'};
    return {html:`Over-allocated this week:<br>`+over.map(p=>`<b>${esc(p.name)}</b> — ${workloadOn(p,TODAY)}% of ${p.capacity}%`).join('<br>')};
  }
  const rows=state.people.map(p=>({p,peak:peakWorkload(p,range.s,range.e)})).filter(r=>r.peak>r.p.capacity)
    .sort((a,b)=>b.peak-a.peak);
  if(!rows.length) return {text:`No one is over-allocated during ${range.label}. 👍`};
  return {html:`Over-allocated during <b>${esc(range.label)}</b> (peak workload):<br>`+
    rows.map(r=>`<b>${esc(r.p.name)}</b> — up to ${r.peak}% of ${r.p.capacity}%`).join('<br>')};
}
function qAtRisk(range){
  const t=portfolioTotals();
  let parts=[];
  const highUnder=state.projects.filter(pr=>projectStaffing(pr).gaps.length).sort((a,b)=>priRank(b.priority)-priRank(a.priority));
  if(highUnder.length){
    parts.push('<b>Understaffed projects</b> (most important first):<br>'+highUnder.map(pr=>{
      const g=projectStaffing(pr).gaps; return `• ${esc(pr.name)} (${pr.priority}) — missing ${g.map(x=>x.missing+'× '+esc(x.skill)).join(', ')}`;
    }).join('<br>'));
  }
  if(t.over.length){
    parts.push('<b>Over-allocated people</b>:<br>'+t.over.map(p=>`• ${esc(p.name)} at ${workloadOn(p,TODAY)}%`).join('<br>'));
  }
  // time off overlapping critical projects in range
  if(range){
    const offs=[];
    state.people.forEach(p=>(p.timeOff||[]).forEach(to=>{ if(overlaps(d(to.start),d(to.end),range.s,range.e)) offs.push(`${esc(p.name)} off ${fmtShort(d(to.start))}–${fmtShort(d(to.end))}`); }));
    if(offs.length) parts.push('<b>Planned time off in '+esc(range.label)+'</b>:<br>'+offs.map(o=>'• '+o).join('<br>'));
  }
  if(!parts.length) return {text:'Nothing major at risk — projects are staffed and no one is over-allocated.'};
  return {html:parts.join('<br><br>')};
}

/* ----- Command handlers ----- */
function cmdAdjust(personTxt, projTxt, delta){
  const p=personByName(personTxt), pr=projectByName(projTxt);
  if(!p) return {text:`I couldn't find a person matching “${esc(personTxt.trim())}”.`};
  if(!pr) return {text:`I couldn't find a project matching “${esc(projTxt.trim())}”.`};
  const allocs=state.allocations.filter(a=>a.personId===p.id && a.projectId===pr.id);
  if(!allocs.length) return {text:`${esc(p.name)} isn't currently assigned to ${esc(pr.name)}.`};
  const a=allocs[0];
  const before=a.percent;
  a.percent=Math.max(0, Math.min(100, a.percent+delta));
  let actionTxt;
  if(a.percent===0){ state.allocations=state.allocations.filter(x=>x.id!==a.id);
    actionTxt=`Removed <b>${esc(p.name)}</b> from <b>${esc(pr.name)}</b> (was ${before}%).`; }
  else actionTxt=`Updated <b>${esc(p.name)}</b> on <b>${esc(pr.name)}</b>: ${before}% → <b>${a.percent}%</b>.`;
  save();
  const now=workloadOn(p,TODAY);
  const flag=now>p.capacity?` ⚠️ ${esc(p.name.split(' ')[0])} is now over-allocated at ${now}%.`:` ${esc(p.name.split(' ')[0])}'s total is now ${now}%.`;
  return {html:actionTxt+flag, action:true};
}
function cmdAssign(personTxt, projTxt, pct){
  const p=personByName(personTxt), pr=projectByName(projTxt);
  if(!p) return {text:`I couldn't find a person matching “${esc(personTxt.trim())}”.`};
  if(!pr) return {text:`I couldn't find a project matching “${esc(projTxt.trim())}”.`};
  const existing=state.allocations.find(a=>a.personId===p.id&&a.projectId===pr.id);
  if(existing){ existing.percent=Math.min(100,pct); save();
    return {html:`<b>${esc(p.name)}</b> was already on <b>${esc(pr.name)}</b> — set to <b>${existing.percent}%</b>.`, action:true}; }
  state.allocations.push({id:uid('a'),personId:p.id,projectId:pr.id,percent:Math.min(100,pct),start:pr.start,end:pr.end});
  save();
  const now=workloadOn(p,TODAY);
  const flag=now>p.capacity?` ⚠️ Heads up: ${esc(p.name.split(' ')[0])} is now over-allocated at ${now}%.`:'';
  return {html:`Assigned <b>${esc(p.name)}</b> to <b>${esc(pr.name)}</b> at <b>${pct}%</b> for the project's dates.${flag}`, action:true};
}
const NUMWORDS={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
function cmdAddProject(qRaw){
  const q=qRaw.toLowerCase();
  // name
  let name='New Project';
  let nm=qRaw.match(/called\s+([A-Za-z0-9 ]+?)(?:\s+(?:starting|that|which|in|needs|needing|beginning)\b|$)/i);
  if(nm) name=nm[1].trim();
  // start
  const range=parseRange(q);
  const start=range? iso(range.s) : iso(addDays(TODAY,30));
  // engineers/people count
  let count=1, skill='Engineer';
  let cm=q.match(/(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+([a-z ]+?)s?\b/);
  if(/needs?|needing|requires?/.test(q)){
    const nm2=q.match(/(?:needs?|needing|requires?)\s+(?:about\s+)?(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+([a-z][a-z ]*?)s?\b/);
    if(nm2){ count=NUMWORDS[nm2[1]]||+nm2[1]||1; skill=titleCase(nm2[2].trim()); }
  }
  const matchedSkill=findSkillIn(q); if(matchedSkill) skill=matchedSkill;
  const endD=iso(addDays(d(start),120));
  const prid=uid('pr');
  state.projects.push({id:prid,name,description:'Added via assistant',start,end:endD,priority:'Medium',
    needs:[{skill,count}]});
  save();
  // suggest staffing
  const cands=suggestForGap(skill, projectById(prid)).slice(0,count);
  const sug=cands.length? ` Suggested people: ${cands.map(c=>esc(c.person.name.split(' ')[0])+' ('+c.spare+'% free)').join(', ')}.`
    : ` I don't see anyone with “${esc(skill)}” skills and spare capacity — you may need to hire.`;
  return {html:`Created project <b>${esc(name)}</b>, starting ${fmt(d(start))}, needing <b>${count}× ${esc(skill)}</b>.${sug}`, action:true};
}
function titleCase(s){ return s.replace(/\b\w/g,c=>c.toUpperCase()); }
function cmdRemovePerson(personTxt){
  const p=personByName(personTxt);
  if(!p) return {text:`I couldn't find a person matching “${esc(personTxt.trim())}”.`};
  const n=allocationsFor(p.id).length;
  state.people=state.people.filter(x=>x.id!==p.id);
  state.allocations=state.allocations.filter(a=>a.personId!==p.id);
  save();
  return {html:`Removed <b>${esc(p.name)}</b> and their ${n} assignment(s). Check the affected projects for new gaps.`, action:true};
}

/* ----- Summaries ----- */
function pushSummary(title, html){ pushMsg('bot', title, {html:`<b>${esc(title)}</b><br>${html}`}); currentTab='assistant'; renderAssistant(); }
function summaryPortfolio(){
  const t=portfolioTotals();
  const util=t.capacity>0?Math.round(t.demand/t.capacity*100):0;
  let html=`Across ${state.people.length} people and ${state.projects.length} projects, the team is using <b>${util}%</b> of its capacity this week (${t.demand}% committed of ${t.capacity}% available).<br><br>`;
  html+= t.over.length? `⚠️ <b>${t.over.length}</b> over-allocated: ${t.over.map(p=>esc(p.name.split(' ')[0])).join(', ')}.<br>` : `✅ No one is over-allocated.<br>`;
  html+= t.idle.length? `💤 <b>${t.idle.length}</b> idle: ${t.idle.map(p=>esc(p.name.split(' ')[0])).join(', ')}.<br>` : `✅ No one is sitting idle.<br>`;
  html+= t.understaffed.length? `🔧 <b>${t.understaffed.length}</b> understaffed: ${t.understaffed.map(p=>esc(p.name)).join(', ')}.` : `✅ All projects are staffed.`;
  pushSummary('Portfolio health summary', html);
}
function summaryProject(id){ const pr=projectById(id); if(pr){ pushMsg('bot','',{html:`<b>${esc(pr.name)} — project summary</b><br>`+projectSummaryText(pr)}); document.getElementById('view'); currentTab='assistant'; renderAssistant(); } }
function summaryPerson(id){ const p=personById(id); if(p){ pushMsg('bot','',{html:`<b>${esc(p.name)} — summary</b><br>`+personSummaryText(p)}); currentTab='assistant'; renderAssistant(); } }
function projectSummaryText(pr){
  const st=projectStaffing(pr);
  let html=`${esc(pr.description)}<br>Runs ${fmt(d(pr.start))} → ${fmt(d(pr.end))}, <b>${pr.priority}</b> priority.<br>`;
  html+=`Team (${st.peopleOn.length}): ${st.members.map(m=>esc(m.person.name.split(' ')[0])+' '+m.alloc.percent+'%').join(', ')||'no one yet'}.<br>`;
  if(st.gaps.length){
    html+=`<span style="color:var(--bad)"><b>Gaps:</b> ${st.gaps.map(g=>g.missing+'× '+esc(g.skill)).join(', ')}.</span> `;
    const g=st.gaps[0]; const c=suggestForGap(g.skill,pr)[0];
    if(c) html+=`Could add ${esc(c.person.name.split(' ')[0])} (${c.spare}% free).`;
  } else html+=`<span style="color:var(--ok)">Fully staffed for the skills it needs.</span>`;
  return html;
}
function personSummaryText(p){
  const s=statusToday(p);
  const allocs=allocationsFor(p.id).map(a=>{ const pr=projectById(a.projectId); return pr?`${esc(pr.name)} (${a.percent}%)`:null; }).filter(Boolean);
  let html=`${esc(p.role)}, ${esc(p.team)} team. Capacity ${p.capacity}%. Skills: ${esc(p.skills.join(', '))}.<br>`;
  html+=`Currently <b>${s.load}%</b> committed — <span class="pill ${s.kind==='off'?'idle':s.kind}">${s.label}</span><br>`;
  html+=`On: ${allocs.join(', ')||'no active projects'}.`;
  if((p.timeOff||[]).length) html+=`<br>Time off: ${p.timeOff.map(t=>fmtShort(d(t.start))+'–'+fmtShort(d(t.end))).join(', ')}.`;
  if(s.kind==='bad'){ const rel=suggestRelief(p)[0]; if(rel&&rel.candidates.length) html+=`<br>💡 To relieve: move some ${esc(rel.project.name)} work to ${esc(rel.candidates[0].person.name.split(' ')[0])} (${rel.candidates[0].spare}% free).`; }
  return html;
}
function summaryWeekly(){
  const t=portfolioTotals();
  const util=t.capacity>0?Math.round(t.demand/t.capacity*100):0;
  const high=state.projects.filter(p=>p.priority==='High');
  let html=`<i>Weekly Resourcing Update — ${fmt(TODAY)}</i><br><br>`;
  html+=`<b>Overall:</b> The team is running at ${util}% of capacity. `;
  html+= t.over.length? `${t.over.length} ${t.over.length===1?'person is':'people are'} over-allocated and need attention. ` : `Workload is balanced. `;
  html+= t.understaffed.length? `${t.understaffed.length} project(s) have staffing gaps.`:`All projects are adequately staffed.`;
  html+=`<br><br><b>Priority projects:</b><br>`;
  html+=high.map(pr=>{ const st=projectStaffing(pr); return `• ${esc(pr.name)} — ${st.peopleOn.length} on the team${st.gaps.length?', needs '+st.gaps.map(g=>g.missing+'× '+esc(g.skill)).join(', '):', fully staffed'}.`; }).join('<br>')||'• None flagged.';
  if(t.over.length){ html+=`<br><br><b>Risks:</b><br>`+t.over.map(p=>`• ${esc(p.name)} at ${workloadOn(p,TODAY)}% — recommend redistributing.`).join('<br>'); }
  html+=`<br><br><b>Actions:</b> Review gaps on high-priority work; rebalance over-allocated team members.`;
  pushSummary('Weekly leadership update', html);
}

/* ============================================================
   Capture command intent for What-if Apply + boot
   ============================================================ */
// Wrap runWhatIf to remember choices for Apply
const _runWhatIf=runWhatIf;
runWhatIf=function(){
  if(whatIf.action==='add-alloc'){
    lastWf={kind:'add-alloc', pid:document.getElementById('wfPerson').value, prid:document.getElementById('wfProject').value, pct:+document.getElementById('wfPct').value||0};
  } else if(whatIf.action==='remove-person'){
    lastWf={kind:'remove-person', pid:document.getElementById('wfRemove').value};
  } else {
    const name=document.getElementById('wfName').value||'New Project';
    const start=document.getElementById('wfStart').value; const eng=+document.getElementById('wfEng').value||1;
    const engPeople=state.people.filter(p=>p.role.toLowerCase().includes('engineer'))
      .map(p=>({p,spare:p.capacity-workloadOn(p,d(start))})).sort((a,b)=>b.spare-a.spare).slice(0,eng).map(e=>e.p.id);
    lastWf={kind:'add-project', name, start, eng, engPeople};
  }
  _runWhatIf();
};

document.getElementById('tabs').addEventListener('click', e=>{
  if(e.target.dataset.tab){ currentTab=e.target.dataset.tab; filters.q=''; render(); }
});
document.getElementById('resetBtn').onclick=()=>{ if(confirm('Restore the original sample data? Your current changes will be lost.')) resetData(); };

render();
